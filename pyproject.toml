[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-flow"
version = "0.1.0"
description = "Git-native ledger and replayable judge projections for collaborative mathematics"
requires-python = ">=3.11"

[project.scripts]
math-flow = "math_flow.cli:main"

[tool.setuptools]
packages = ["math_flow"]

