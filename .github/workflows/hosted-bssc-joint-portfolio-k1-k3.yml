name: Hosted BSSC joint portfolio K1-K3 holdout
run-name: "Run one unpublished BSSC joint K1-K3 sample"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type bssc-joint-portfolio-serial-k1-k3-v1-provider-run to authorize this paid unpublished holdout
        required: true
        type: string

concurrency:
  group: hosted-bssc-joint-portfolio-k1-k3
  cancel-in-progress: false

permissions: {}

jobs:
  holdout:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Require canonical main and exact one-run authorization
        env:
          MATH_FLOW_CONFIRMATION: "${{ inputs.confirmation }}"
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "The joint holdout may run only from canonical main." >&2
            exit 1
          fi
          if [[ "$MATH_FLOW_CONFIRMATION" != "bssc-joint-portfolio-serial-k1-k3-v1-provider-run" ]]; then
            echo "The exact paid-holdout confirmation phrase is required." >&2
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Refuse stale or noncanonical runtime code
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/main)" ]]; then
            echo "Canonical main moved after dispatch; refusing provider work." >&2
            exit 1
          fi
      - name: Rebuild the zero-call execution plan
        run: |
          set -euo pipefail
          python -m experiments.bssc_joint_portfolio_serial_hosted \
            --root . \
            --output-dir "${RUNNER_TEMP}/joint-k1-k3/plan"
      - name: Execute exactly one fresh unpublished K1-K3 sample
        env:
          OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"
          MATH_FLOW_SITE_URL: "${{ github.server_url }}/${{ github.repository }}"
          MATH_FLOW_JOINT_K1_K3_AUTHORIZATION: "${{ inputs.confirmation }}"
        run: |
          set -euo pipefail
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "The OPENROUTER_API_KEY repository secret is not configured." >&2
            exit 1
          fi
          python -m experiments.bssc_joint_portfolio_serial_hosted \
            --root . \
            --execute-provider \
            --output-dir "${RUNNER_TEMP}/joint-k1-k3/execution"
      - name: Summarize the retained result
        if: always()
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/joint-k1-k3/execution/report.json"
          {
            echo "## Unpublished BSSC joint K1-K3 holdout"
            echo
            echo "Publication and continuation are forbidden. This workflow retains local experiment artifacts only."
            echo
            if [[ -f "$report" ]]; then
              echo "| Field | Value |"
              echo "| --- | --- |"
              echo "| Status | \`$(jq -r '.status' "$report")\` |"
              echo "| Provider calls | \`$(jq -r '.telemetry.providerCalls' "$report")\` |"
              echo "| Reported tokens | \`$(jq -r '.telemetry.reportedTokens' "$report")\` |"
              echo "| Reported cost | \`\$$(jq -r '.telemetry.reportedCostUsd' "$report")\` |"
              echo "| Bundle digest | \`$(jq -r '.bundleDigest // "none"' "$report")\` |"
              failure="$(jq -r '.failure.summary // empty' "$report")"
              if [[ -n "$failure" ]]; then
                echo
                echo "Failure: $failure"
              fi
            else
              echo "Execution stopped before a semantic report was materialized."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the complete unpublished evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "bssc-joint-portfolio-k1-k3-${{ github.run_id }}"
          path: "${{ runner.temp }}/joint-k1-k3"
          if-no-files-found: error
          retention-days: 30
