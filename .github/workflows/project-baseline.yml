name: Project baseline judge

on:
  workflow_dispatch:
    inputs:
      problem:
        description: Problem id
        required: true
        default: triangle-midpoints
  push:
    branches: [main]
    paths:
      - "problems/**"
      - "protocol/judges/baseline-v1.json"
      - "protocol/profiles/flat-json-v1.json"
      - "protocol/schemas/projection.schema.json"
      - "protocol/schemas/run.schema.json"
      - "math_flow/**"
      - ".github/workflows/project-baseline.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      problems: ${{ steps.scope.outputs.problems }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Discover affected problems
        id: scope
        shell: bash
        env:
          EVENT_NAME: "${{ github.event_name }}"
          REQUESTED_PROBLEM: "${{ inputs.problem }}"
          BASE_SHA: "${{ github.event.before }}"
          HEAD_SHA: "${{ github.sha }}"
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            problems=$(jq -cn --arg problem "$REQUESTED_PROBLEM" '[$problem]')
          else
            scope=$(python -m math_flow affected-problems \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --global-pattern 'math_flow/**' \
              --global-pattern 'protocol/judges/baseline-v1.json' \
              --global-pattern 'protocol/profiles/flat-json-v1.json' \
              --global-pattern 'protocol/schemas/projection.schema.json' \
              --global-pattern 'protocol/schemas/run.schema.json' \
              --global-pattern '.github/workflows/project-baseline.yml')
            problems=$(jq -c '.problems' <<<"$scope")
          fi
          echo "problems=$problems" >> "$GITHUB_OUTPUT"

  project:
    needs: discover
    if: ${{ needs.discover.outputs.problems != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        problem: ${{ fromJSON(needs.discover.outputs.problems) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generate judge-run bundle
        run: >-
          python -m math_flow run
          --problem "${{ matrix.problem }}"
          --judge protocol/judges/baseline-v1.json
          --head HEAD
          --output-dir "projections/baseline-v1/${{ matrix.problem }}/${{ github.sha }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "baseline-v1-${{ matrix.problem }}-${{ github.sha }}"
          path: "projections/baseline-v1/${{ matrix.problem }}/${{ github.sha }}"
          if-no-files-found: error
