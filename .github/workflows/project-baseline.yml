name: Project baseline judge

on:
  workflow_dispatch:
    inputs:
      problem:
        description: Problem id
        required: true
        default: triangle-midpoints
  push:
    branches: [main]
    paths:
      - "problems/**"
      - "protocol/judges/**"
      - "math_flow/**"

permissions:
  contents: read

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate projections
        shell: bash
        env:
          EVENT_NAME: "${{ github.event_name }}"
          REQUESTED_PROBLEM: "${{ inputs.problem }}"
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            problem_ids="$REQUESTED_PROBLEM"
          else
            problem_ids=$(find problems -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          fi

          for problem_id in $problem_ids; do
            python -m math_flow project \
              --problem "$problem_id" \
              --judge protocol/judges/baseline-v1.json \
              --head HEAD \
              --output "projections/baseline-v1/$problem_id/${{ github.sha }}.json"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: "baseline-v1-${{ github.sha }}"
          path: projections/
          if-no-files-found: error
