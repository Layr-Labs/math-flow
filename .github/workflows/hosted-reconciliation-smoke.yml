name: Hosted reconciliation smoke test
run-name: "Reconcile controlled repository fixture"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_HOSTED_RECONCILIATION_SMOKE to authorize one paid reconciliation
        required: true

concurrency:
  group: hosted-reconciliation-smoke
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require canonical main and explicit spend confirmation
        env:
          MATH_FLOW_SMOKE_CONFIRMATION: "${{ inputs.confirmation }}"
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Hosted reconciliation smoke tests may run only from canonical main." >&2
            exit 1
          fi
          if [[ "$MATH_FLOW_SMOKE_CONFIRMATION" != "RUN_HOSTED_RECONCILIATION_SMOKE" ]]; then
            echo "The exact paid-smoke confirmation phrase is required." >&2
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: fixture
        name: Derive one controlled conflict from repository evidence
        run: |
          set -euo pipefail
          staging="${RUNNER_TEMP}/hosted-reconciliation-smoke"
          mkdir -p "$staging" "$staging/empty-projection"
          python -m math_flow.hosted_reconciliation_smoke \
            --root . \
            --head HEAD \
            --output-dir "$staging"

          mapfile -t primary_dirs < <(
            jq -r '.primaryBundlePaths[]' "$staging/fixture-plan.json"
          )
          fixture_head="$(jq -r '.ledgerHead' "$staging/fixture-plan.json")"
          plan=(
            python -m math_flow reconciliation-plan
            --problem no-three-in-line-77
            --primary-judge protocol/judges/openrouter-markdown-judgment-v1.json
            --reconciliation-judge protocol/judges/openrouter-markdown-reconciliation-v1.json
            --head "$fixture_head"
            --projection-dir "$staging/empty-projection"
            --output "$staging/reconciliation-plan-before.json"
          )
          for primary_dir in "${primary_dirs[@]}"; do
            plan+=(--primary-judgment-dir "$primary_dir")
          done
          "${plan[@]}"

          conflict_id="$(jq -r '.conflictId' "$staging/fixture-plan.json")"
          claim_key="$(jq -r '.claimKey' "$staging/fixture-plan.json")"
          jq -e \
            --arg conflict_id "$conflict_id" \
            --arg claim_key "$claim_key" \
            '(.primaryJudgmentIds | length) == 4' \
            "$staging/reconciliation-plan-before.json" >/dev/null
          jq -e \
            --arg conflict_id "$conflict_id" \
            --arg claim_key "$claim_key" \
            '(.missingConflicts | length) == 1 and
             .missingConflicts[0].conflictId == $conflict_id and
             .missingConflicts[0].claimKey == $claim_key' \
            "$staging/reconciliation-plan-before.json" >/dev/null
          echo "conflict_id=$conflict_id" >> "$GITHUB_OUTPUT"
          echo "claim_key=$claim_key" >> "$GITHUB_OUTPUT"
          echo "fixture_head=$fixture_head" >> "$GITHUB_OUTPUT"
      - name: Run the pinned hosted reconciliation judge
        env:
          OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"
          MATH_FLOW_SITE_URL: "${{ github.server_url }}/${{ github.repository }}"
        run: |
          set -euo pipefail
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "The OPENROUTER_API_KEY repository secret is not configured." >&2
            exit 1
          fi
          staging="${RUNNER_TEMP}/hosted-reconciliation-smoke"
          mapfile -t primary_dirs < <(
            jq -r '.primaryBundlePaths[]' "$staging/fixture-plan.json"
          )
          reconcile=(
            python -m math_flow reconcile
            --problem no-three-in-line-77
            --judge protocol/judges/openrouter-markdown-reconciliation-v1.json
            --head "${{ steps.fixture.outputs.fixture_head }}"
            --conflicts "$staging/conflicts.json"
            --conflict-id "${{ steps.fixture.outputs.conflict_id }}"
            --output-dir "$staging/reconciliation"
          )
          for primary_dir in "${primary_dirs[@]}"; do
            reconcile+=(--judgment-dir "$primary_dir")
          done
          "${reconcile[@]}"
      - name: Re-plan and verify the completed reconciliation
        run: |
          set -euo pipefail
          staging="${RUNNER_TEMP}/hosted-reconciliation-smoke"
          mapfile -t primary_dirs < <(
            jq -r '.primaryBundlePaths[]' "$staging/fixture-plan.json"
          )
          verify=(
            python -m math_flow reconciliation-plan
            --problem no-three-in-line-77
            --primary-judge protocol/judges/openrouter-markdown-judgment-v1.json
            --reconciliation-judge protocol/judges/openrouter-markdown-reconciliation-v1.json
            --head "${{ steps.fixture.outputs.fixture_head }}"
            --projection-dir "$staging/empty-projection"
            --additional-root "$staging/reconciliation"
            --expected-new-conflict "${{ steps.fixture.outputs.conflict_id }}"
            --output "$staging/reconciliation-plan-after.json"
          )
          for primary_dir in "${primary_dirs[@]}"; do
            verify+=(--primary-judgment-dir "$primary_dir")
          done
          "${verify[@]}"
          jq -e \
            --arg conflict_id "${{ steps.fixture.outputs.conflict_id }}" \
            '(.missingConflicts | length) == 0 and
             (.newBundles | length) == 1 and
             .newBundles[0].conflictId == $conflict_id' \
            "$staging/reconciliation-plan-after.json" >/dev/null

          judgment_id="$(jq -r '.judgmentId' "$staging/reconciliation/judgment.json")"
          outcome="$(jq -r '.reconciliation.outcome' "$staging/reconciliation/judgment.json")"
          run_digest="$(jq -r '.newBundles[0].runDigest' "$staging/reconciliation-plan-after.json")"
          {
            echo "## Hosted reconciliation smoke test"
            echo
            echo "This run used deterministic fallible primary fixtures and did not publish or mutate knowledge state."
            echo
            echo "| Field | Verified value |"
            echo "| --- | --- |"
            echo "| Claim key | \`${{ steps.fixture.outputs.claim_key }}\` |"
            echo "| Conflict | \`${{ steps.fixture.outputs.conflict_id }}\` |"
            echo "| Reconciliation judgment | \`$judgment_id\` |"
            echo "| Outcome | \`$outcome\` |"
            echo "| Run digest | \`$run_digest\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the complete smoke-test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "hosted-reconciliation-smoke-${{ github.run_id }}"
          path: "${{ runner.temp }}/hosted-reconciliation-smoke"
          if-no-files-found: error
          retention-days: 14
