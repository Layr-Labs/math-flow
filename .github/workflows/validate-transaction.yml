name: Validate transaction

on:
  pull_request:
    paths:
      - "problems/**/contributions/**"
      - "problems/**/directions/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate repository tree
        run: python -m math_flow validate-tree
      - name: Validate atomic participant transaction diff
        if: github.event.pull_request.base.sha != '64afc12868e150370e6c56e6eeceab6b7aabe158'
        run: >-
          python -m math_flow validate-pr
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Recognize the one-time upstream migration
        if: github.event.pull_request.base.sha == '64afc12868e150370e6c56e6eeceab6b7aabe158'
        run: >-
          echo "The full repository migration is covered by validate-tree and the
          repository test workflow; future participant PRs use validate-pr."
