name: Auto-merge validated participant transaction

on:
  workflow_run:
    workflows: ["Validate repository"]
    types: [completed]

# This workflow runs trusted code from the default branch. Candidate commits are
# fetched only as inert Git data and are never checked out or executed here.
permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-contribution-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - id: pr
        name: Resolve the current pull request head
        env:
          GH_TOKEN: "${{ github.token }}"
          REPOSITORY: "${{ github.repository }}"
          WORKFLOW_RUN_ID: "${{ github.event.workflow_run.id }}"
        shell: bash
        run: |
          set -euo pipefail
          workflow_run="${RUNNER_TEMP}/workflow-run.json"
          gh api \
            "repos/${REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}" \
            > "$workflow_run"
          mapfile -t pr_numbers < <(jq -r '.pull_requests[].number' "$workflow_run")
          if [[ "${#pr_numbers[@]}" -ne 1 ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Expected one associated pull request; found ${#pr_numbers[@]}."
            exit 0
          fi

          pr_number="${pr_numbers[0]}"
          pr="${RUNNER_TEMP}/pull-request.json"
          gh api "repos/${REPOSITORY}/pulls/${pr_number}" > "$pr"
          if [[ "$(jq -r '.state' "$pr")" != "open" ]] ||
             [[ "$(jq -r '.draft' "$pr")" == "true" ]] ||
             [[ "$(jq -r '.base.ref' "$pr")" != "main" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Pull request is closed, draft, or does not target main."
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' "$pr")" >> "$GITHUB_OUTPUT"

      - id: checks
        if: steps.pr.outputs.eligible == 'true'
        name: Require every validation check on the current head
        env:
          GH_TOKEN: "${{ github.token }}"
          REPOSITORY: "${{ github.repository }}"
          HEAD_SHA: "${{ steps.pr.outputs.head_sha }}"
        shell: bash
        run: |
          set -euo pipefail
          required=("protocol" "viewer" "validate" "Admin admission approval")
          for attempt in {1..60}; do
            checks="${RUNNER_TEMP}/check-runs.json"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              > "$checks"
            pending=()
            failed=()
            for name in "${required[@]}"; do
              result=$(jq -r --arg name "$name" '
                [.check_runs[] | select(.name == $name)]
                | sort_by(.started_at // "")
                | last
                | if . == null then "missing"
                  elif .status != "completed" then .status
                  else (.conclusion // "missing") end
              ' "$checks")
              case "$result" in
                success) ;;
                missing|queued|in_progress|pending|requested|waiting)
                  pending+=("${name}:${result}")
                  ;;
                *) failed+=("${name}:${result}") ;;
              esac
            done

            if [[ "${#failed[@]}" -gt 0 ]]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "Validation did not pass: ${failed[*]}"
              exit 0
            fi
            if [[ "${#pending[@]}" -eq 0 ]]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for validation: ${pending[*]}"
            sleep 2
          done
          echo "Timed out waiting for required validation checks." >&2
          exit 1

      - id: transaction
        if: steps.checks.outputs.ready == 'true'
        name: Re-verify one atomic participant transaction against current main
        env:
          PR_NUMBER: "${{ steps.pr.outputs.number }}"
          HEAD_SHA: "${{ steps.pr.outputs.head_sha }}"
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/math-flow-auto-merge-head"
          if [[ "$(git rev-parse refs/remotes/origin/math-flow-auto-merge-head)" != "$HEAD_SHA" ]]; then
            echo "Pull request head changed while validation was running." >&2
            exit 1
          fi

          result="${RUNNER_TEMP}/validated-transaction.json"
          if ! python -m math_flow validate-pr \
            --base origin/main \
            --head refs/remotes/origin/math-flow-auto-merge-head \
            > "$result"; then
            echo "atomic=false" >> "$GITHUB_OUTPUT"
            echo "Pull request is not an atomic contribution or direction event; leaving it for maintainers."
            exit 0
          fi
          echo "atomic=true" >> "$GITHUB_OUTPUT"
          echo "problem=$(jq -r '.problemId' "$result")" >> "$GITHUB_OUTPUT"
          echo "transaction_kind=$(jq -r '.transactionKind' "$result")" >> "$GITHUB_OUTPUT"

      - id: approval
        if: steps.transaction.outputs.atomic == 'true'
        name: Approve the re-verified participant transaction
        env:
          GH_TOKEN: "${{ github.token }}"
          REPOSITORY: "${{ github.repository }}"
          PR_NUMBER: "${{ steps.pr.outputs.number }}"
          HEAD_SHA: "${{ steps.pr.outputs.head_sha }}"
        shell: bash
        run: |
          set -euo pipefail
          review="${RUNNER_TEMP}/approval.json"
          gh api --method POST \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f event=APPROVE \
            -f commit_id="$HEAD_SHA" \
            -f body="Approved by the trusted base-branch workflow after atomic revalidation against current main." \
            > "$review"
          if [[ "$(jq -r '.state' "$review")" != "APPROVED" ]]; then
            jq -r '.message // "GitHub did not record an approving review."' "$review" >&2
            exit 1
          fi

      - id: merge
        if: steps.transaction.outputs.atomic == 'true'
        name: Squash-merge the validated participant transaction
        env:
          GH_TOKEN: "${{ github.token }}"
          REPOSITORY: "${{ github.repository }}"
          PR_NUMBER: "${{ steps.pr.outputs.number }}"
          HEAD_SHA: "${{ steps.pr.outputs.head_sha }}"
        shell: bash
        run: |
          set -euo pipefail
          merged="${RUNNER_TEMP}/merge.json"
          gh api --method PUT \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA" \
            > "$merged"
          if [[ "$(jq -r '.merged' "$merged")" != "true" ]]; then
            jq -r '.message' "$merged" >&2
            exit 1
          fi
          merged_sha="$(jq -r '.sha' "$merged")"
          echo "sha=$merged_sha" >> "$GITHUB_OUTPUT"
          echo "Merged pull request ${PR_NUMBER} at ${merged_sha}."

      - if: >-
          steps.transaction.outputs.atomic == 'true' &&
          steps.transaction.outputs.transaction_kind == 'contribution'
        name: Dispatch affected problem projections
        env:
          GH_TOKEN: "${{ github.token }}"
          PROBLEM: "${{ steps.transaction.outputs.problem }}"
          MERGED_SHA: "${{ steps.merge.outputs.sha }}"
        shell: bash
        run: |
          set -euo pipefail
          dispatch() {
            local workflow="$1"
            shift
            for attempt in {1..5}; do
              if gh workflow run "$workflow" --ref main "$@"; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          dispatch project-baseline.yml -f problem="$PROBLEM"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          transaction_path="$(
            python -m math_flow ledger \
              --problem "$PROBLEM" \
              --head refs/remotes/origin/main \
            | jq -r --arg transaction "$MERGED_SHA" \
                '.transactions[] | select(.transactionId == $transaction) | .path'
          )"
          if [[ -z "$transaction_path" ]]; then
            echo "Merged transaction is absent from the canonical problem ledger." >&2
            exit 1
          fi
          if git cat-file -e "${MERGED_SHA}:${transaction_path}/verification.json" 2>/dev/null; then
            dispatch project-attestation.yml \
              -f problem="$PROBLEM" \
              -f transaction="$MERGED_SHA"
          fi
          projection_plan="${RUNNER_TEMP}/active-projections.json"
          python -m math_flow list-active-projections \
            --problem "$PROBLEM" \
            --head refs/remotes/origin/main \
            --engine openrouter-repository-v1 \
            --output "$projection_plan"
          failed_stream_dispatches=0
          while IFS= read -r stream; do
            judgment_stream_id="$(jq -r '.judgmentStreamId' <<< "$stream")"
            first_projection="$(jq -r '.projections[0]' <<< "$stream")"
            remaining_projections="$(jq -c '.projections[1:]' <<< "$stream")"
            if ! dispatch project-openrouter.yml \
              -f projection="$first_projection" \
              -f problem="$PROBLEM" \
              -f judgment_stream_id="$judgment_stream_id" \
              -f remaining_projections="$remaining_projections"; then
              echo "Failed to dispatch judgment stream $judgment_stream_id." >&2
              failed_stream_dispatches=$((failed_stream_dispatches + 1))
            fi
          done < <(
            jq -c '
              .projections
              | sort_by(.judgmentStreamId, .projectionId)
              | group_by(.judgmentStreamId)[]
              | {
                  judgmentStreamId: .[0].judgmentStreamId,
                  projections: [.[].projectionId]
                }
            ' "$projection_plan"
          )
          if [[ "$failed_stream_dispatches" -gt 0 ]]; then
            exit 1
          fi

      - if: >-
          steps.transaction.outputs.atomic == 'true' &&
          steps.transaction.outputs.transaction_kind == 'direction-event'
        name: Refresh the repository viewer after a direction event
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: gh workflow run refresh-viewer-catalog.yml --ref main
