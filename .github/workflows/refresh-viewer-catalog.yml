name: Refresh repository viewer catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-viewer-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Rebuild and publish the catalog from canonical repository state
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..8}; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            if ! git ls-remote --exit-code origin refs/heads/projections >/dev/null 2>&1; then
              echo "The projections branch does not exist yet." >&2
              exit 1
            fi
            git fetch origin +refs/heads/projections:refs/remotes/origin/projections
            projection_dir="${RUNNER_TEMP}/viewer-catalog-${attempt}"
            git worktree add --detach "$projection_dir" refs/remotes/origin/projections
            python -m math_flow export-viewer-catalog \
              --projection-dir "$projection_dir" \
              --repository "${GITHUB_REPOSITORY}" \
              --canonical-ref refs/remotes/origin/main \
              --projection-ref projections \
              --output "$projection_dir/viewer/catalog.json"
            if [[ -z "$(git -C "$projection_dir" status --porcelain=v1 --untracked-files=all)" ]]; then
              echo "The repository viewer catalog is already current."
              exit 0
            fi
            if python -m math_flow github-publish-projection \
              --projection-dir "$projection_dir" \
              --repository "$GITHUB_REPOSITORY" \
              --branch projections \
              --message "Refresh research directions in viewer catalog from run ${GITHUB_RUN_ID}"; then
              exit 0
            fi
            if [[ "$attempt" -eq 8 ]]; then
              echo "Viewer catalog publication did not converge after ${attempt} attempts." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
