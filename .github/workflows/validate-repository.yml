name: Validate repository

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "problems/**"
      - "protocol/**"
      - "math_flow/**"
      - "tests/**"
      - "viewer/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "problems/**"
      - "protocol/**"
      - "math_flow/**"
      - "tests/**"
      - "viewer/**"

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate repository tree
        run: python -m math_flow validate-tree
      - name: Run protocol tests
        run: python -m unittest discover -s tests -v

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install viewer dependencies
        run: npm ci
      - name: Test production viewer build
        run: npm test
      - name: Lint viewer
        run: npm run lint
