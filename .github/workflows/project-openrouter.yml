name: OpenRouter repository projection
run-name: "Project ${{ inputs.projection }}/${{ inputs.problem }}/${{ inputs.subject_transaction || 'batch' }}"

on:
  workflow_dispatch:
    inputs:
      projection:
        description: Approved projection id
        required: true
        default: openrouter-research-v3
      problem:
        description: Problem id
        required: true
      resume_run_id:
        description: Prior workflow run containing successful judgment artifacts
        required: false
        default: ""
      remaining_projections:
        description: Internal JSON queue of active projections to run afterward
        required: false
        default: "[]"
      judgment_stream_id:
        description: Internal verified problem/primary-judge stream identity
        required: false
        default: ""
      subject_transaction:
        description: Exact canonical transaction targeted by this workflow
        required: false
        default: ""
      require_no_primary_work:
        description: Fail before provider work unless live primary coverage is complete
        required: false
        type: boolean
        default: false

env:
  MATH_FLOW_PROJECTION_ID: "${{ inputs.projection }}"
  MATH_FLOW_PROBLEM_ID: "${{ inputs.problem }}"
  MATH_FLOW_RESUME_RUN_ID: "${{ inputs.resume_run_id }}"
  MATH_FLOW_REMAINING_PROJECTIONS: "${{ inputs.remaining_projections }}"
  MATH_FLOW_JUDGMENT_STREAM_ID: "${{ inputs.judgment_stream_id }}"
  MATH_FLOW_SUBJECT_TRANSACTION: "${{ inputs.subject_transaction }}"
  MATH_FLOW_REQUIRE_NO_PRIMARY_WORK: "${{ inputs.require_no_primary_work }}"

concurrency:
  group: "openrouter-projection-${{ inputs.projection }}-${{ inputs.problem }}-${{ inputs.subject_transaction || 'batch' }}"
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.coverage.outputs.matrix }}
      count: ${{ steps.coverage.outputs.count }}
      expected_subjects: ${{ steps.coverage.outputs.expected_subjects }}
      primary_judge: ${{ steps.registry.outputs.primary_judge }}
      primary_judge_implementation: ${{ steps.registry.outputs.primary_judge_implementation }}
      judgment_stream_id: ${{ steps.registry.outputs.judgment_stream_id }}
      reconciliation_judge: ${{ steps.registry.outputs.reconciliation_judge }}
      reconciliation_enabled: ${{ steps.registry.outputs.reconciliation_enabled }}
      knowledge_builder: ${{ steps.registry.outputs.knowledge_builder }}
      projection_digest: ${{ steps.registry.outputs.projection_digest }}
      judgment_max_parallel: ${{ steps.registry.outputs.judgment_max_parallel }}
      minimum_interval: ${{ steps.registry.outputs.minimum_interval }}
      maximum_judgments: ${{ steps.registry.outputs.maximum_judgments }}
    steps:
      - name: Require canonical main dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Repository projections may only be dispatched from canonical main." >&2
            exit 1
          fi
          if [[ -n "$MATH_FLOW_RESUME_RUN_ID" && ! "$MATH_FLOW_RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "resume_run_id must be a positive GitHub Actions run ID." >&2
            exit 1
          fi
          if [[ -n "$MATH_FLOW_JUDGMENT_STREAM_ID" && \
                ! "$MATH_FLOW_JUDGMENT_STREAM_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "judgment_stream_id must be empty or a SHA-256 digest." >&2
            exit 1
          fi
          if [[ -n "$MATH_FLOW_SUBJECT_TRANSACTION" && \
                ! "$MATH_FLOW_SUBJECT_TRANSACTION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "subject_transaction must be empty or a full canonical commit SHA." >&2
            exit 1
          fi
          if [[ "$MATH_FLOW_REQUIRE_NO_PRIMARY_WORK" != "true" && \
                "$MATH_FLOW_REQUIRE_NO_PRIMARY_WORK" != "false" ]]; then
            echo "require_no_primary_work must be a boolean." >&2
            exit 1
          fi
          if ! jq -e '
            type == "array" and
            all(.[]; type == "string" and test("^[a-z0-9][a-z0-9-]*$")) and
            length == (unique | length)
          ' <<< "$MATH_FLOW_REMAINING_PROJECTIONS" >/dev/null; then
            echo "remaining_projections must be a unique JSON array of projection ids." >&2
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: registry
        name: Resolve approved projection
        run: |
          set -euo pipefail
          resolved="${RUNNER_TEMP}/projection-spec.json"
          python -m math_flow resolve-projection \
            --projection "$MATH_FLOW_PROJECTION_ID" \
            --problem "$MATH_FLOW_PROBLEM_ID" \
            --head HEAD \
            --output "$resolved"
          if [[ "$(jq -r '.engine' "$resolved")" != "openrouter-repository-v1" ]]; then
            echo "projection is not executable by project-openrouter.yml" >&2
            exit 1
          fi
          echo "primary_judge=$(jq -r '.primaryJudge' "$resolved")" >> "$GITHUB_OUTPUT"
          primary_judge="$(jq -r '.primaryJudge' "$resolved")"
          echo "primary_judge_implementation=$(jq -r '.implementation' "$primary_judge")" >> "$GITHUB_OUTPUT"
          expected_stream_id="$(jq -r '.judgmentStreamId' "$resolved")"
          if [[ -n "$MATH_FLOW_JUDGMENT_STREAM_ID" && \
                "$MATH_FLOW_JUDGMENT_STREAM_ID" != "$expected_stream_id" ]]; then
            echo "judgment_stream_id does not match the governed primary judge." >&2
            exit 1
          fi
          echo "judgment_stream_id=$expected_stream_id" >> "$GITHUB_OUTPUT"
          reconciliation_judge="$(jq -r '.reconciliationJudge // empty' "$resolved")"
          echo "reconciliation_judge=$reconciliation_judge" >> "$GITHUB_OUTPUT"
          if [[ -n "$reconciliation_judge" ]]; then
            echo "reconciliation_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "reconciliation_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          echo "knowledge_builder=$(jq -r '.knowledgeBuilder' "$resolved")" >> "$GITHUB_OUTPUT"
          echo "projection_digest=$(jq -r '.projectionSpecDigest' "$resolved")" >> "$GITHUB_OUTPUT"
          echo "judgment_max_parallel=$(jq -r '.scheduling.judgmentMaxParallel' "$resolved")" >> "$GITHUB_OUTPUT"
          echo "minimum_interval=$(jq -r '.scheduling.knowledgeMinimumIntervalSeconds' "$resolved")" >> "$GITHUB_OUTPUT"
          echo "maximum_judgments=$(jq -r '.scheduling.maximumJudgmentsPerBuild' "$resolved")" >> "$GITHUB_OUTPUT"
      - name: Prepare published projection state
        run: |
          set -euo pipefail
          projection_dir="${RUNNER_TEMP}/projection-branch"
          if git ls-remote --exit-code origin refs/heads/projections >/dev/null 2>&1; then
            git fetch origin refs/heads/projections:refs/remotes/origin/projections
            git worktree add --detach "$projection_dir" refs/remotes/origin/projections
          else
            mkdir -p "$projection_dir"
          fi
      - id: coverage
        name: Plan missing transaction judgments
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/judgment-plan.json"
          command=(python -m math_flow judgment-plan \
            --problem "$MATH_FLOW_PROBLEM_ID" \
            --judge "${{ steps.registry.outputs.primary_judge }}" \
            --head HEAD \
            --projection-dir "${RUNNER_TEMP}/projection-branch" \
            --output "$plan")
          if [[ -n "$MATH_FLOW_SUBJECT_TRANSACTION" ]]; then
            command+=(--subject-transaction "$MATH_FLOW_SUBJECT_TRANSACTION")
          fi
          "${command[@]}"
          if [[ "$MATH_FLOW_REQUIRE_NO_PRIMARY_WORK" == "true" && \
                "$(jq '.missingTransactions | length' "$plan")" != "0" ]]; then
            echo "Formation-only wake found live missing primary work; refusing a batch judgment." >&2
            exit 1
          fi
          echo "matrix=$(jq -c '.matrix' "$plan")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.missingTransactions | length' "$plan")" >> "$GITHUB_OUTPUT"
          echo "expected_subjects=$(jq -c '[.missingTransactions[].transactionId]' "$plan")" >> "$GITHUB_OUTPUT"
          jq '{problemId, judgeSpec, covered: (.coveredTransactionIds | length), missingTransactions, deferredTransactions: (.deferredTransactions // [])}' "$plan"

  judgment:
    needs: plan
    if: needs.plan.outputs.count != '0' && inputs.resume_run_id == ''
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.judgment_max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Prepare bounded knowledge context
        if: >-
          needs.plan.outputs.primary_judge_implementation == 'openrouter-validity-judgment-v2' ||
          needs.plan.outputs.primary_judge_implementation == 'openrouter-validity-judgment-v3' ||
          needs.plan.outputs.primary_judge_implementation == 'openrouter-validity-judgment-v4'
        run: |
          set -euo pipefail
          projection_dir="${RUNNER_TEMP}/projection-branch"
          if git ls-remote --exit-code origin refs/heads/projections >/dev/null 2>&1; then
            git fetch origin refs/heads/projections:refs/remotes/origin/projections
            git worktree add --detach "$projection_dir" refs/remotes/origin/projections
          else
            mkdir -p "$projection_dir"
          fi
      - name: Generate primary judgment for transaction ${{ matrix.ordinal }}
        env:
          OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"
          MATH_FLOW_SITE_URL: "${{ github.server_url }}/${{ github.repository }}"
        run: |
          set -euo pipefail
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "The OPENROUTER_API_KEY repository secret is not configured." >&2
            exit 1
          fi
          staging_dir="${RUNNER_TEMP}/math-flow-staging"
          mkdir -p "$staging_dir"
          ledger="$staging_dir/ledger.json"
          python -m math_flow ledger \
            --problem "$MATH_FLOW_PROBLEM_ID" \
            --head HEAD \
            > "$ledger"
          command=(
            python -m math_flow judgment
            --problem "$MATH_FLOW_PROBLEM_ID"
            --judge "${{ needs.plan.outputs.primary_judge }}"
            --head HEAD
            --subject "${{ matrix.transactionId }}"
            --output-dir "$staging_dir/judgment-${{ matrix.ordinal }}"
          )
          if [[ "${{ needs.plan.outputs.primary_judge_implementation }}" == "openrouter-validity-judgment-v2" || \
                "${{ needs.plan.outputs.primary_judge_implementation }}" == "openrouter-validity-judgment-v3" || \
                "${{ needs.plan.outputs.primary_judge_implementation }}" == "openrouter-validity-judgment-v4" ]]; then
            command+=(--projection-dir "${RUNNER_TEMP}/projection-branch")
          else
            while IFS= read -r evidence; do
              command+=(--evidence "$evidence")
            done < <(
              jq -r \
                --argjson ordinal "${{ matrix.ordinal }}" \
                '.transactions[] | select(.ordinal < $ordinal) | .transactionId' \
                "$ledger"
            )
          fi
          "${command[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "judgment-${{ inputs.problem }}-${{ matrix.ordinal }}"
          path: "${{ runner.temp }}/math-flow-staging/judgment-${{ matrix.ordinal }}"
          if-no-files-found: error

  publish_primary:
    needs: [plan, judgment]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.plan.outputs.count == '0' ||
      needs.judgment.result == 'success' ||
      (inputs.subject_transaction == '' && needs.judgment.result == 'failure') ||
      (inputs.resume_run_id != '' && needs.judgment.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.plan.outputs.count != '0'
        with:
          pattern: "judgment-${{ inputs.problem }}-*"
          path: "${{ runner.temp }}/primary-publication/judgments"
          github-token: "${{ github.token }}"
          run-id: "${{ inputs.resume_run_id || github.run_id }}"
      - name: Verify and publish each immutable primary judgment
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          MATH_FLOW_EXPECTED_SUBJECTS: "${{ needs.plan.outputs.expected_subjects }}"
          MATH_FLOW_JUDGMENT_RESULT: "${{ needs.judgment.result }}"
          MATH_FLOW_RESUME_RUN_ID: "${{ inputs.resume_run_id }}"
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.plan.outputs.count }}" == "0" ]]; then
            echo "The targeted primary judgment is already published or deferred."
            exit 0
          fi
          staging_dir="${RUNNER_TEMP}/primary-publication"
          verified="$staging_dir/verified-primary.json"
          allow_primary_subset=false
          retain_primary_subset=false
          failed_primary_matrix=false
          if [[ -z "$MATH_FLOW_SUBJECT_TRANSACTION" && \
                "$MATH_FLOW_JUDGMENT_RESULT" == "failure" ]]; then
            # A fail-fast:false matrix can retain successful paid siblings.
            # Publish that verified planned subset before reporting failure.
            allow_primary_subset=true
            failed_primary_matrix=true
          elif [[ -z "$MATH_FLOW_SUBJECT_TRANSACTION" && \
                  -n "$MATH_FLOW_RESUME_RUN_ID" ]]; then
            # A subjectless resume may refer to a partially failed historical
            # matrix. Its successful subset is still immutable and reusable.
            retain_primary_subset=true
          fi
          verify=(
            python -m math_flow verify-judgment-artifacts
            --problem "$MATH_FLOW_PROBLEM_ID"
            --judge "${{ needs.plan.outputs.primary_judge }}"
            --head HEAD
            --search-root "$staging_dir/judgments"
            --output "$verified"
          )
          while IFS= read -r subject; do
            verify+=(--expected-subject "$subject")
          done < <(
            printf '%s\n' "$MATH_FLOW_EXPECTED_SUBJECTS" | jq -r '.[]'
          )
          if [[ "$allow_primary_subset" == "true" ]]; then
            verify+=(--allow-expected-subset)
          elif [[ "$retain_primary_subset" == "true" ]]; then
            verify+=(--retain-expected-subset)
          fi
          "${verify[@]}"

          publish_one() {
            local bundle_dir="$1"
            local bundle_number="$2"
            for attempt in {1..8}; do
              local projection_dir="${RUNNER_TEMP}/primary-publish-${bundle_number}-${attempt}"
              git fetch origin \
                +refs/heads/main:refs/remotes/origin/main
              if git ls-remote --exit-code origin refs/heads/projections >/dev/null 2>&1; then
                git fetch origin \
                  +refs/heads/projections:refs/remotes/origin/projections
                git worktree add --detach "$projection_dir" \
                  refs/remotes/origin/projections
              else
                git worktree add --detach "$projection_dir" HEAD
                git -C "$projection_dir" switch --orphan projection-publish
              fi
              if ! python -m math_flow publish-batch \
                --projection-dir "$projection_dir" \
                --bundle "$bundle_dir"; then
                return 1
              fi
              python -m math_flow export-viewer-catalog \
                --projection-dir "$projection_dir" \
                --repository "${{ github.repository }}" \
                --canonical-ref refs/remotes/origin/main \
                --projection-ref projections \
                --output "$projection_dir/viewer/catalog.json"
              if [[ -z "$(git -C "$projection_dir" status --porcelain=v1 \
                --untracked-files=all)" ]]; then
                return 0
              fi
              if python -m math_flow github-publish-projection \
                --projection-dir "$projection_dir" \
                --repository "$GITHUB_REPOSITORY" \
                --branch projections \
                --message "Publish primary $bundle_number for ${MATH_FLOW_PROJECTION_ID}/${MATH_FLOW_PROBLEM_ID} from run ${GITHUB_RUN_ID}"; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          failures=0
          bundle_number=0
          while IFS= read -r bundle_dir; do
            bundle_number=$((bundle_number + 1))
            if ! publish_one "$bundle_dir" "$bundle_number"; then
              echo "Failed to publish verified primary bundle $bundle_number." >&2
              failures=$((failures + 1))
            fi
          done < <(jq -r '.bundles[].path' "$verified")
          if [[ "$failures" -gt 0 ]]; then
            exit 1
          fi
          if [[ "$allow_primary_subset" == "true" || \
                "$retain_primary_subset" == "true" ]]; then
            missing_subjects="$(jq -c \
              '.missingExpectedSubjectTransactionIds' "$verified")"
            rejected_bundles='[]'
            if [[ "$retain_primary_subset" == "true" ]]; then
              rejected_bundles="$(jq -c '.rejectedBundles' "$verified")"
            fi
            if [[ "$missing_subjects" != "[]" || \
                  "$rejected_bundles" != "[]" || \
                  "$failed_primary_matrix" == "true" ]]; then
              echo "Published the retained primary subset; the matrix remains incomplete. Missing subjects: $missing_subjects; rejected bundles: $rejected_bundles" >&2
              exit 1
            fi
          fi

  reconciliation_plan:
    needs: [plan, judgment, publish_primary]
    if: >-
      always() &&
      needs.publish_primary.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.coverage.outputs.matrix }}
      count: ${{ steps.coverage.outputs.count }}
      expected_conflicts: ${{ steps.coverage.outputs.expected_conflicts }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Prepare published projection state
        run: |
          set -euo pipefail
          projection_dir="${RUNNER_TEMP}/projection-branch"
          if git ls-remote --exit-code origin refs/heads/projections >/dev/null 2>&1; then
            git fetch origin refs/heads/projections:refs/remotes/origin/projections
            git worktree add --detach "$projection_dir" \
              refs/remotes/origin/projections
          else
            mkdir -p "$projection_dir"
          fi
      - id: coverage
        name: Plan missing reconciliation judgments
        env:
          MATH_FLOW_EXPECTED_SUBJECTS: "${{ needs.plan.outputs.expected_subjects }}"
        run: |
          set -euo pipefail
          if [[ "${{ needs.plan.outputs.reconciliation_enabled }}" != "true" ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            echo 'expected_conflicts=[]' >> "$GITHUB_OUTPUT"
            echo "This projection has no reconciliation stage."
            exit 0
          fi
          staging_dir="${RUNNER_TEMP}/math-flow-reconciliation-plan"
          primary_plan="$staging_dir/primary-inputs.json"
          command=(
            python -m math_flow judgment-input-plan
            --problem "$MATH_FLOW_PROBLEM_ID"
            --judge "${{ needs.plan.outputs.primary_judge }}"
            --head HEAD
            --projection-dir "${RUNNER_TEMP}/projection-branch"
            --output "$primary_plan"
          )
          if [[ -n "$MATH_FLOW_SUBJECT_TRANSACTION" ]]; then
            command+=(--target-subject "$MATH_FLOW_SUBJECT_TRANSACTION")
          fi
          "${command[@]}"

          if [[ -n "$MATH_FLOW_SUBJECT_TRANSACTION" && \
                "$(jq '.pendingTransactions | length' "$primary_plan")" != "0" ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            echo 'expected_conflicts=[]' >> "$GITHUB_OUTPUT"
            echo "Other ready primary subjects remain pending; reconciliation waits for their immutable publication."
            exit 0
          fi

          mapfile -t primary_dirs < <(jq -r '.bundles[].path' "$primary_plan")
          reconciliation_plan="$staging_dir/reconciliation-plan.json"
          reconcile=(
            python -m math_flow reconciliation-plan
            --problem "$MATH_FLOW_PROBLEM_ID"
            --primary-judge "${{ needs.plan.outputs.primary_judge }}"
            --reconciliation-judge "${{ needs.plan.outputs.reconciliation_judge }}"
            --head HEAD
            --projection-dir "${RUNNER_TEMP}/projection-branch"
            --output "$reconciliation_plan"
          )
          for primary_dir in "${primary_dirs[@]}"; do
            reconcile+=(--primary-judgment-dir "$primary_dir")
          done
          "${reconcile[@]}"
          echo "matrix=$(jq -c '.matrix' "$reconciliation_plan")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.missingConflicts | length' "$reconciliation_plan")" >> "$GITHUB_OUTPUT"
          echo "expected_conflicts=$(jq -c '[.missingConflicts[].conflictId]' "$reconciliation_plan")" >> "$GITHUB_OUTPUT"
          jq '{problemId, primaryJudgments: (.primaryJudgmentIds | length), conflicts: (.conflicts | length), inherited: (.publishedBundles | length), missingConflicts}' "$reconciliation_plan"

  reconciliation:
    needs: [plan, publish_primary, reconciliation_plan]
    if: >-
      always() &&
      needs.reconciliation_plan.result == 'success' &&
      needs.plan.outputs.reconciliation_enabled == 'true' &&
      needs.reconciliation_plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.judgment_max_parallel) }}
      matrix: ${{ fromJSON(needs.reconciliation_plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Prepare published projection state
        run: |
          set -euo pipefail
          projection_dir="${RUNNER_TEMP}/projection-branch"
          if git ls-remote --exit-code origin refs/heads/projections >/dev/null 2>&1; then
            git fetch origin refs/heads/projections:refs/remotes/origin/projections
            git worktree add --detach "$projection_dir" \
              refs/remotes/origin/projections
          else
            mkdir -p "$projection_dir"
          fi
      - name: Reconcile conflict ${{ matrix.ordinal }}
        env:
          OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"
          MATH_FLOW_SITE_URL: "${{ github.server_url }}/${{ github.repository }}"
        run: |
          set -euo pipefail
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "The OPENROUTER_API_KEY repository secret is not configured." >&2
            exit 1
          fi
          staging_dir="${RUNNER_TEMP}/math-flow-reconciliation"
          primary_plan="$staging_dir/primary-inputs.json"
          command=(
            python -m math_flow judgment-input-plan
            --problem "$MATH_FLOW_PROBLEM_ID"
            --judge "${{ needs.plan.outputs.primary_judge }}"
            --head HEAD
            --projection-dir "${RUNNER_TEMP}/projection-branch"
            --output "$primary_plan"
          )
          if [[ -n "$MATH_FLOW_SUBJECT_TRANSACTION" ]]; then
            command+=(--target-subject "$MATH_FLOW_SUBJECT_TRANSACTION")
          fi
          "${command[@]}"

          mapfile -t primary_dirs < <(jq -r '.bundles[].path' "$primary_plan")
          conflict_plan="$staging_dir/conflicts.json"
          reconcile_plan=(
            python -m math_flow reconciliation-plan
            --problem "$MATH_FLOW_PROBLEM_ID"
            --primary-judge "${{ needs.plan.outputs.primary_judge }}"
            --reconciliation-judge "${{ needs.plan.outputs.reconciliation_judge }}"
            --head HEAD
            --projection-dir "${RUNNER_TEMP}/projection-branch"
            --output "$conflict_plan"
          )
          for primary_dir in "${primary_dirs[@]}"; do
            reconcile_plan+=(--primary-judgment-dir "$primary_dir")
          done
          "${reconcile_plan[@]}"

          reconcile=(
            python -m math_flow reconcile
            --problem "$MATH_FLOW_PROBLEM_ID"
            --judge "${{ needs.plan.outputs.reconciliation_judge }}"
            --head HEAD
            --conflicts "$conflict_plan"
            --conflict-id "${{ matrix.conflictId }}"
            --output-dir "$staging_dir/reconciliation-${{ matrix.ordinal }}"
          )
          for primary_dir in "${primary_dirs[@]}"; do
            reconcile+=(--judgment-dir "$primary_dir")
          done
          "${reconcile[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "reconciliation-${{ inputs.problem }}-${{ matrix.ordinal }}"
          path: "${{ runner.temp }}/math-flow-reconciliation/reconciliation-${{ matrix.ordinal }}"
          if-no-files-found: error

  publish_reconciliation:
    needs: [plan, publish_primary, reconciliation_plan, reconciliation]
    if: >-
      always() &&
      needs.reconciliation_plan.result == 'success' &&
      (needs.reconciliation_plan.outputs.count == '0' ||
      needs.reconciliation.result == 'success' ||
      needs.reconciliation.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.reconciliation_plan.outputs.count != '0'
        with:
          pattern: "reconciliation-${{ inputs.problem }}-*"
          path: "${{ runner.temp }}/reconciliation-publication/artifacts"
          github-token: "${{ github.token }}"
          run-id: "${{ github.run_id }}"
      - name: Verify and publish each immutable reconciliation judgment
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          MATH_FLOW_EXPECTED_CONFLICTS: "${{ needs.reconciliation_plan.outputs.expected_conflicts }}"
          MATH_FLOW_RECONCILIATION_RESULT: "${{ needs.reconciliation.result }}"
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.reconciliation_plan.outputs.count }}" == "0" ]]; then
            echo "No new reconciliation judgment needs publication."
            exit 0
          fi
          staging_dir="${RUNNER_TEMP}/reconciliation-publication"
          failed_reconciliation_matrix=false
          if [[ "$MATH_FLOW_RECONCILIATION_RESULT" == "failure" ]]; then
            # Retain every successfully paid sibling from a fail-fast:false
            # matrix, while keeping formation blocked until the plan is whole.
            failed_reconciliation_matrix=true
          fi
          projection_dir="$staging_dir/verification-projection"
          if git ls-remote --exit-code origin refs/heads/projections >/dev/null 2>&1; then
            git fetch origin refs/heads/projections:refs/remotes/origin/projections
            git worktree add --detach "$projection_dir" refs/remotes/origin/projections
          else
            mkdir -p "$projection_dir"
          fi
          primary_plan="$staging_dir/primary-inputs.json"
          python -m math_flow judgment-input-plan \
            --problem "$MATH_FLOW_PROBLEM_ID" \
            --judge "${{ needs.plan.outputs.primary_judge }}" \
            --head HEAD \
            --projection-dir "$projection_dir" \
            --output "$primary_plan"
          verified="$staging_dir/verified-reconciliations.json"
          reconcile=(
            python -m math_flow reconciliation-plan
            --problem "$MATH_FLOW_PROBLEM_ID"
            --primary-judge "${{ needs.plan.outputs.primary_judge }}"
            --reconciliation-judge "${{ needs.plan.outputs.reconciliation_judge }}"
            --head HEAD
            --projection-dir "$projection_dir"
            --additional-root "$staging_dir/artifacts"
            --output "$verified"
          )
          while IFS= read -r primary_dir; do
            reconcile+=(--primary-judgment-dir "$primary_dir")
          done < <(jq -r '.bundles[].path' "$primary_plan")
          while IFS= read -r conflict_id; do
            reconcile+=(--expected-new-conflict "$conflict_id")
          done < <(
            printf '%s\n' "$MATH_FLOW_EXPECTED_CONFLICTS" | jq -r '.[]'
          )
          # Always use the frozen-plan subset verifier at publication. A
          # successful matrix must still be complete below, but this lets an
          # overlapping canonical conflict reach per-bundle idempotency or
          # uniqueness checks without stranding unrelated bundles.
          reconcile+=(--allow-expected-subset)
          "${reconcile[@]}"

          publish_one() {
            local bundle_dir="$1"
            local bundle_number="$2"
            for attempt in {1..8}; do
              local publish_dir="${RUNNER_TEMP}/reconciliation-publish-${bundle_number}-${attempt}"
              git fetch origin \
                +refs/heads/projections:refs/remotes/origin/projections \
                +refs/heads/main:refs/remotes/origin/main
              git worktree add --detach "$publish_dir" \
                refs/remotes/origin/projections
              if ! python -m math_flow publish-batch \
                --projection-dir "$publish_dir" \
                --bundle "$bundle_dir"; then
                return 1
              fi
              python -m math_flow export-viewer-catalog \
                --projection-dir "$publish_dir" \
                --repository "${{ github.repository }}" \
                --canonical-ref refs/remotes/origin/main \
                --projection-ref projections \
                --output "$publish_dir/viewer/catalog.json"
              if [[ -z "$(git -C "$publish_dir" status --porcelain=v1 \
                --untracked-files=all)" ]]; then
                return 0
              fi
              if python -m math_flow github-publish-projection \
                --projection-dir "$publish_dir" \
                --repository "$GITHUB_REPOSITORY" \
                --branch projections \
                --message "Publish reconciliation $bundle_number for ${MATH_FLOW_PROJECTION_ID}/${MATH_FLOW_PROBLEM_ID} from run ${GITHUB_RUN_ID}"; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          failures=0
          bundle_number=0
          while IFS= read -r bundle_dir; do
            bundle_number=$((bundle_number + 1))
            if ! publish_one "$bundle_dir" "$bundle_number"; then
              echo "Failed to publish reconciliation bundle $bundle_number." >&2
              failures=$((failures + 1))
            fi
          done < <(jq -r '.newBundles[].path' "$verified")
          if [[ "$failures" -gt 0 ]]; then
            exit 1
          fi
          missing_conflicts="$(jq -c '.missingExpectedConflictIds' "$verified")"
          if [[ "$failed_reconciliation_matrix" == "true" || \
                "$missing_conflicts" != "[]" ]]; then
            echo "Published the successful reconciliation subset; the matrix remains incomplete. Missing conflicts: $missing_conflicts" >&2
            exit 1
          fi

  form:
    needs: [plan, publish_primary, reconciliation_plan, publish_reconciliation]
    if: >-
      always() &&
      needs.publish_reconciliation.result == 'success'
    concurrency:
      group: "openrouter-formation-${{ inputs.projection }}-${{ inputs.problem }}"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      publication_changed: ${{ steps.staging.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: "${{ github.sha }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Prepare the orphan projection worktree
        run: |
          set -euo pipefail
          projection_dir="${RUNNER_TEMP}/projection-branch"
          staging_dir="${RUNNER_TEMP}/math-flow-staging"
          mkdir -p "$staging_dir"
          if git ls-remote --exit-code origin refs/heads/projections >/dev/null 2>&1; then
            git fetch origin refs/heads/projections:refs/remotes/origin/projections
            git worktree add --detach "$projection_dir" refs/remotes/origin/projections
          else
            git worktree add --detach "$projection_dir" HEAD
            git -C "$projection_dir" switch --orphan projection-publish
          fi
          scheduler="$projection_dir/coordination/scheduler.json"
          if [[ -f "$scheduler" ]]; then
            cp "$scheduler" "$staging_dir/scheduler-base.json"
          else
            printf '{"schemaVersion":1,"lanes":{}}\n' \
              > "$staging_dir/scheduler-base.json"
          fi
      - name: Plan published judgment and conflict inputs
        run: |
          set -euo pipefail
          staging_dir="${RUNNER_TEMP}/math-flow-staging"
          mkdir -p "$staging_dir"
          input_plan="$staging_dir/judgment-input-plan.json"
          command=(
            python -m math_flow judgment-input-plan
            --problem "$MATH_FLOW_PROBLEM_ID"
            --judge "${{ needs.plan.outputs.primary_judge }}"
            --head HEAD
            --projection-dir "${RUNNER_TEMP}/projection-branch"
            --output "$input_plan"
          )
          if [[ -n "$MATH_FLOW_SUBJECT_TRANSACTION" ]]; then
            command+=(--target-subject "$MATH_FLOW_SUBJECT_TRANSACTION")
          fi
          "${command[@]}"

          if [[ -n "$MATH_FLOW_SUBJECT_TRANSACTION" && \
                "$(jq '.pendingTransactions | length' "$input_plan")" != "0" ]]; then
            if [[ "${{ needs.plan.outputs.reconciliation_enabled }}" == "true" ]]; then
              touch "$staging_dir/formation-deferred"
              jq -r '"Formation waits for every reconciliation-enabled primary subject: " +
                ([.pendingTransactions[].transactionId] | join(", "))' "$input_plan"
            else
              jq -r '"Formation will integrate published independent work while other primary subjects remain pending: " +
                ([.pendingTransactions[].transactionId] | join(", "))' "$input_plan"
            fi
          fi

          mapfile -t primary_dirs < <(jq -r '.bundles[].path' "$input_plan")
          reconciliation_plan="$staging_dir/reconciliation-plan.json"
          if [[ -f "$staging_dir/formation-deferred" ]]; then
            jq -n \
              --arg problem "$MATH_FLOW_PROBLEM_ID" \
              '{
                schemaVersion: 1,
                problemId: $problem,
                primaryJudgmentIds: [],
                conflicts: [],
                publishedBundles: [],
                newBundles: [],
                missingConflicts: [],
                matrix: {include: []},
                bundles: []
              }' > "$reconciliation_plan"
          elif [[ "${{ needs.plan.outputs.reconciliation_enabled }}" == "true" ]]; then
            reconcile=(
              python -m math_flow reconciliation-plan
              --problem "$MATH_FLOW_PROBLEM_ID"
              --primary-judge "${{ needs.plan.outputs.primary_judge }}"
              --reconciliation-judge "${{ needs.plan.outputs.reconciliation_judge }}"
              --head HEAD
              --projection-dir "${RUNNER_TEMP}/projection-branch"
              --output "$reconciliation_plan"
            )
            for primary_dir in "${primary_dirs[@]}"; do
              reconcile+=(--primary-judgment-dir "$primary_dir")
            done
            "${reconcile[@]}"
            if [[ "$(jq '.missingConflicts | length' "$reconciliation_plan")" != "0" ]]; then
              touch "$staging_dir/formation-deferred"
              echo "Formation waits for missing reconciliation judgments."
            fi
          else
            jq -n \
              --arg problem "$MATH_FLOW_PROBLEM_ID" \
              '{
                schemaVersion: 1,
                problemId: $problem,
                primaryJudgmentIds: [],
                conflicts: [],
                publishedBundles: [],
                newBundles: [],
                missingConflicts: [],
                matrix: {include: []},
                bundles: []
              }' > "$reconciliation_plan"
          fi

          jq -r '.bundles[].path' "$input_plan" > "$staging_dir/judgment-dirs.txt"
          jq -r '.bundles[].path' "$reconciliation_plan" >> "$staging_dir/judgment-dirs.txt"
          : > "$staging_dir/new-judgment-dirs.txt"
          jq -s '{bundles: (.[0].bundles + .[1].bundles)}' \
            "$input_plan" "$reconciliation_plan" \
            > "$staging_dir/all-judgment-inputs.json"
          jq -n \
            --slurpfile primary "$input_plan" \
            --slurpfile reconciliation "$reconciliation_plan" \
            '{
              problemId: $primary[0].problemId,
              primary: {
                inherited: ($primary[0].publishedBundles | length),
                new: ($primary[0].newBundles | length),
                total: ($primary[0].bundles | length)
              },
              reconciliation: {
                conflicts: ($reconciliation[0].conflicts | length),
                inherited: ($reconciliation[0].publishedBundles | length),
                new: ($reconciliation[0].newBundles | length),
                total: ($reconciliation[0].bundles | length)
              }
            }'
      - id: claim
        name: Claim the current knowledge lane
        run: |
          set -euo pipefail
          projection_dir="${RUNNER_TEMP}/projection-branch"
          staging_dir="${RUNNER_TEMP}/math-flow-staging"
          if [[ -f "$staging_dir/formation-deferred" ]]; then
            echo "claimed=false" >> "$GITHUB_OUTPUT"
            echo "The targeted run published its immutable judgments; a complete later run will form them."
            exit 0
          fi
          scheduler="$projection_dir/coordination/scheduler.json"
          mapfile -t judgment_dirs < "$staging_dir/judgment-dirs.txt"
          trigger=(
            python -m math_flow knowledge-trigger
            --scheduler-file "$scheduler"
            --problem "$MATH_FLOW_PROBLEM_ID"
            --builder "${{ needs.plan.outputs.knowledge_builder }}"
            --projection-digest "${{ needs.plan.outputs.projection_digest }}"
            --minimum-interval "${{ needs.plan.outputs.minimum_interval }}"
            --output "$staging_dir/lane.json"
          )
          for judgment_dir in "${judgment_dirs[@]}"; do
            trigger+=(--judgment-dir "$judgment_dir")
          done
          trigger+=(--conflicts "$staging_dir/reconciliation-plan.json")
          "${trigger[@]}"
          lane_id="$(jq -r '.laneId' "$staging_dir/lane.json")"
          python -m math_flow knowledge-claim \
            --scheduler-file "$scheduler" \
            --lane-id "$lane_id" \
            --maximum-judgments "${{ needs.plan.outputs.maximum_judgments }}" \
            --output "$staging_dir/claim.json"
          if [[ "$(jq -r 'type' "$staging_dir/claim.json")" != "object" ]]; then
            echo "claimed=false" >> "$GITHUB_OUTPUT"
            echo "The knowledge lane has no eligible build; completing as a no-op."
            exit 0
          fi
          echo "claimed=true" >> "$GITHUB_OUTPUT"
          jq -r --slurpfile claim "$staging_dir/claim.json" '
            .bundles[]
            | select(.judgmentId as $id | ($claim[0].judgmentIds | index($id)))
            | .path
          ' "$staging_dir/all-judgment-inputs.json" > "$staging_dir/claimed-judgment-dirs.txt"
          jq --slurpfile claim "$staging_dir/claim.json" '
            {
              schemaVersion: 1,
              conflicts: [
                .conflicts[]
                | select(
                    .conflictId as $id
                    | ($claim[0].conflictIds | index($id))
                  )
              ]
            }
          ' "$staging_dir/reconciliation-plan.json" > "$staging_dir/claimed-conflicts.json"
      - id: formation
        name: Build the next serialized knowledge state
        if: steps.claim.outputs.claimed == 'true'
        env:
          OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"
          MATH_FLOW_SITE_URL: "${{ github.server_url }}/${{ github.repository }}"
        run: |
          set -euo pipefail
          projection_dir="${RUNNER_TEMP}/projection-branch"
          staging_dir="${RUNNER_TEMP}/math-flow-staging"
          mapfile -t judgment_dirs < "$staging_dir/claimed-judgment-dirs.txt"
          command=(
            python -m math_flow knowledge-build
            --problem "$MATH_FLOW_PROBLEM_ID"
            --builder "${{ needs.plan.outputs.knowledge_builder }}"
            --head HEAD
            --claim "$staging_dir/claim.json"
            --conflicts "$staging_dir/claimed-conflicts.json"
            --checkpoint-dir "$staging_dir/checkpoints"
            --output-dir "$staging_dir/knowledge-build"
          )
          for judgment_dir in "${judgment_dirs[@]}"; do
            command+=(--judgment-dir "$judgment_dir")
          done
          base_digest="$(jq -r '.baseStateRun // empty' "$staging_dir/claim.json")"
          if [[ -n "$base_digest" ]]; then
            base_hex="${base_digest#sha256:}"
            base_dir="$projection_dir/objects/knowledge-build/${base_hex:0:2}/$base_hex"
            if [[ ! -d "$base_dir" ]]; then
              echo "Published base state is missing: $base_digest" >&2
              exit 1
            fi
            command+=(--base-run "$base_dir")
          fi
          "${command[@]}"
      - id: staging
        name: Complete the lane and stage publication inputs
        if: always() && steps.claim.outcome == 'success'
        run: |
          set -euo pipefail
          projection_dir="${RUNNER_TEMP}/projection-branch"
          staging_dir="${RUNNER_TEMP}/math-flow-staging"
          scheduler="$projection_dir/coordination/scheduler.json"
          mapfile -t new_judgment_dirs < "$staging_dir/new-judgment-dirs.txt"
          if [[ "${{ steps.claim.outputs.claimed }}" == "true" ]]; then
            lane_id="$(jq -r '.laneId' "$staging_dir/claim.json")"
            build_token="$(jq -r '.buildToken' "$staging_dir/claim.json")"
            if [[ "${{ steps.formation.outcome }}" == "success" ]]; then
              python -m math_flow knowledge-complete \
                --scheduler-file "$scheduler" \
                --lane-id "$lane_id" \
                --build-token "$build_token" \
                --state-run-dir "$staging_dir/knowledge-build"
            else
              problem_ledger_digest="$(
                jq -r '.problemLedgerDigest' \
                  "$staging_dir/judgment-input-plan.json"
              )"
              python -m math_flow knowledge-fail \
                --scheduler-file "$scheduler" \
                --lane-id "$lane_id" \
                --build-token "$build_token" \
                --problem-ledger-digest "$problem_ledger_digest"
            fi
          fi

          publication="$staging_dir/publication"
          mkdir -p "$publication/bundles"
          bundle_index=0
          for bundle_dir in "${new_judgment_dirs[@]}"; do
            bundle_index=$((bundle_index + 1))
            cp -R "$bundle_dir" "$publication/bundles/$bundle_index"
          done
          if [[ "${{ steps.claim.outputs.claimed }}" == "true" && \
                "${{ steps.formation.outcome }}" == "success" ]]; then
            bundle_index=$((bundle_index + 1))
            cp -R "$staging_dir/knowledge-build" \
              "$publication/bundles/$bundle_index"
          fi
          cp "$staging_dir/scheduler-base.json" "$publication/scheduler-base.json"
          if [[ -f "$scheduler" ]]; then
            cp "$scheduler" "$publication/scheduler-next.json"
          else
            printf '{"schemaVersion":1,"lanes":{}}\n' \
              > "$publication/scheduler-next.json"
          fi

          if [[ "$bundle_index" -gt 0 ]] || \
             ! cmp -s "$publication/scheduler-base.json" \
               "$publication/scheduler-next.json"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new run objects or scheduler update need publication."
          fi
      - name: Retain completed knowledge state before publication
        if: >-
          steps.claim.outputs.claimed == 'true' &&
          steps.formation.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "knowledge-state-${{ inputs.problem }}-${{ github.run_id }}"
          path: "${{ runner.temp }}/math-flow-staging/knowledge-build"
          if-no-files-found: error
          retention-days: 7
      - name: Retain publication inputs for the single publisher
        if: always() && steps.staging.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "projection-publication-${{ inputs.problem }}-${{ github.run_id }}"
          path: "${{ runner.temp }}/math-flow-staging/publication"
          if-no-files-found: error
          retention-days: 7
      - name: Publish scheduler and knowledge state while holding the formation lane
        if: always() && steps.staging.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          publication="${RUNNER_TEMP}/math-flow-staging/publication"
          mapfile -d '' -t bundle_dirs < <(
            find "$publication/bundles" -mindepth 1 -maxdepth 1 \
              -type d -print0 | sort -z
          )
          for attempt in {1..8}; do
            projection_dir="${RUNNER_TEMP}/projection-publish-${attempt}"
            git fetch origin \
              +refs/heads/main:refs/remotes/origin/main
            if git ls-remote --exit-code origin refs/heads/projections >/dev/null 2>&1; then
              git fetch origin \
                +refs/heads/projections:refs/remotes/origin/projections
              git worktree add --detach "$projection_dir" \
                refs/remotes/origin/projections
            else
              git worktree add --detach "$projection_dir" HEAD
              git -C "$projection_dir" switch --orphan projection-publish
            fi

            current_scheduler="${RUNNER_TEMP}/scheduler-current-${attempt}.json"
            if [[ -f "$projection_dir/coordination/scheduler.json" ]]; then
              cp "$projection_dir/coordination/scheduler.json" "$current_scheduler"
            else
              printf '{"schemaVersion":1,"lanes":{}}\n' > "$current_scheduler"
            fi
            python -m math_flow merge-schedulers \
              --base "$publication/scheduler-base.json" \
              --ours "$publication/scheduler-next.json" \
              --theirs "$current_scheduler" \
              --output "$projection_dir/coordination/scheduler.json"

            if [[ "${#bundle_dirs[@]}" -gt 0 ]]; then
              publish=(python -m math_flow publish-batch --projection-dir "$projection_dir")
              for bundle_dir in "${bundle_dirs[@]}"; do
                publish+=(--bundle "$bundle_dir")
              done
              "${publish[@]}"
            fi
            python -m math_flow export-viewer-catalog \
              --projection-dir "$projection_dir" \
              --repository "${{ github.repository }}" \
              --canonical-ref refs/remotes/origin/main \
              --projection-ref projections \
              --output "$projection_dir/viewer/catalog.json"

            if [[ -z "$(git -C "$projection_dir" status --porcelain=v1 \
              --untracked-files=all)" ]]; then
              echo "The exact projection publication is already present."
              exit 0
            fi
            if python -m math_flow github-publish-projection \
              --projection-dir "$projection_dir" \
              --repository "${GITHUB_REPOSITORY}" \
              --branch projections \
              --message "Publish ${MATH_FLOW_PROJECTION_ID}/${MATH_FLOW_PROBLEM_ID} from run ${GITHUB_RUN_ID}"; then
              exit 0
            fi
            if [[ "$attempt" -eq 8 ]]; then
              echo "Projection publication did not converge after ${attempt} attempts." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - name: Upload formation diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "formation-diagnostics-${{ inputs.problem }}-${{ github.run_id }}"
          path: "${{ runner.temp }}/math-flow-staging"
          if-no-files-found: error
          retention-days: 7

  dispatch-next:
    needs: [plan, publish_primary, publish_reconciliation, form]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the next projection sharing this judgment stream
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          if [[ "${{ needs.plan.result }}" != "success" || \
                "${{ needs.form.result }}" != "success" ]]; then
            echo "The current projection did not finish formation; the durable wake-up planner will retry it." >&2
          fi
          next_projection="$(jq -r '.[0] // empty' <<< "$MATH_FLOW_REMAINING_PROJECTIONS")"
          if [[ -z "$next_projection" ]]; then
            exit 0
          fi
          remaining="$(jq -c '.[1:]' <<< "$MATH_FLOW_REMAINING_PROJECTIONS")"
          gh workflow run project-openrouter.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f projection="$next_projection" \
            -f problem="$MATH_FLOW_PROBLEM_ID" \
            -f judgment_stream_id="${{ needs.plan.outputs.judgment_stream_id }}" \
