name: Objective verifier attestation
run-name: "Attest ${{ inputs.problem }}/${{ inputs.transaction }}"

on:
  workflow_dispatch:
    inputs:
      problem:
        description: Canonical problem id
        required: true
      transaction:
        description: Full canonical contribution transaction SHA
        required: true

permissions:
  actions: write
  contents: write

concurrency:
  group: "objective-attestation-${{ inputs.problem }}-${{ inputs.transaction }}"
  cancel-in-progress: false

env:
  MATH_FLOW_PROBLEM_ID: "${{ inputs.problem }}"
  MATH_FLOW_TRANSACTION_ID: "${{ inputs.transaction }}"

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Require an exact canonical request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Objective attestations may only be dispatched from canonical main." >&2
            exit 1
          fi
          if [[ ! "$MATH_FLOW_PROBLEM_ID" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "problem must be a canonical slug." >&2
            exit 1
          fi
          if [[ ! "$MATH_FLOW_TRANSACTION_ID" =~ ^[0-9a-f]{40}$ ]]; then
            echo "transaction must be a full canonical commit SHA." >&2
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: preflight
        name: Verify the request without executing participant code
        shell: bash
        run: |
          set -euo pipefail
          projection_dir="${RUNNER_TEMP}/projection-preflight"
          if git ls-remote --exit-code origin refs/heads/projections >/dev/null 2>&1; then
            git fetch origin refs/heads/projections:refs/remotes/origin/projections
            git worktree add --detach "$projection_dir" refs/remotes/origin/projections
          else
            git worktree add --detach "$projection_dir" HEAD
            git -C "$projection_dir" switch --orphan projection-preflight
          fi
          plan="${RUNNER_TEMP}/attestation-plan.json"
          python -m math_flow attestation-plan \
            --problem "$MATH_FLOW_PROBLEM_ID" \
            --transaction "$MATH_FLOW_TRANSACTION_ID" \
            --head HEAD \
            --projection-dir "$projection_dir" \
            --output "$plan"
          echo "eligible=$(jq -r '.eligible' "$plan")" >> "$GITHUB_OUTPUT"
          echo "request_digest=$(jq -r '.requestDigest' "$plan")" >> "$GITHUB_OUTPUT"
          if [[ "$(jq -r '.eligible' "$plan")" != "true" ]]; then
            jq -r '"No execution: \(.reasonCode), existing run \(.publishedRunDigest)."' "$plan"
          fi
      - if: steps.preflight.outputs.eligible == 'true'
        name: Execute the pinned networkless verifier
        shell: bash
        run: |
          set -euo pipefail
          python -m math_flow attest \
            --problem "$MATH_FLOW_PROBLEM_ID" \
            --transaction "$MATH_FLOW_TRANSACTION_ID" \
            --head HEAD \
            --output-dir "${RUNNER_TEMP}/attestation-bundle"
          python -m math_flow verify-attestation \
            --bundle "${RUNNER_TEMP}/attestation-bundle" \
            --head HEAD
      - if: steps.preflight.outputs.eligible == 'true'
        name: Recheck and publish the immutable attestation
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..8}; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            projection_dir="${RUNNER_TEMP}/projection-publish-${attempt}"
            if git ls-remote --exit-code origin refs/heads/projections >/dev/null 2>&1; then
              git fetch origin +refs/heads/projections:refs/remotes/origin/projections
              git worktree add --detach "$projection_dir" refs/remotes/origin/projections
            else
              git worktree add --detach "$projection_dir" HEAD
              git -C "$projection_dir" switch --orphan projection-publish
            fi
            current_plan="${RUNNER_TEMP}/attestation-publish-plan-${attempt}.json"
            python -m math_flow attestation-plan \
              --problem "$MATH_FLOW_PROBLEM_ID" \
              --transaction "$MATH_FLOW_TRANSACTION_ID" \
              --head refs/remotes/origin/main \
              --projection-dir "$projection_dir" \
              --output "$current_plan"
            if [[ "$(jq -r '.eligible' "$current_plan")" != "true" ]]; then
              echo "Discarding an already-published attestation."
              exit 0
            fi
            if [[ "$(jq -r '.requestDigest' "$current_plan")" != "${{ steps.preflight.outputs.request_digest }}" ]]; then
              echo "Discarding an attestation whose canonical request changed." >&2
              exit 1
            fi
            python -m math_flow verify-attestation \
              --bundle "${RUNNER_TEMP}/attestation-bundle" \
              --head refs/remotes/origin/main
            python -m math_flow publish-batch \
              --projection-dir "$projection_dir" \
              --bundle "${RUNNER_TEMP}/attestation-bundle"
            python -m math_flow export-viewer-catalog \
              --projection-dir "$projection_dir" \
              --repository "$GITHUB_REPOSITORY" \
              --canonical-ref refs/remotes/origin/main \
              --projection-ref projections \
              --output "$projection_dir/viewer/catalog.json"
            if python -m math_flow github-publish-projection \
              --projection-dir "$projection_dir" \
              --repository "$GITHUB_REPOSITORY" \
              --branch projections \
              --message "Publish ${MATH_FLOW_PROBLEM_ID} objective attestation from run ${GITHUB_RUN_ID}"; then
              exit 0
            fi
            if [[ "$attempt" -eq 8 ]]; then
              echo "Attestation publication did not converge after ${attempt} attempts." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - if: steps.preflight.outputs.eligible == 'true'
        name: Retain the exact attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: objective-attestation-${{ inputs.problem }}-${{ inputs.transaction }}
          path: ${{ runner.temp }}/attestation-bundle
          retention-days: 14
          if-no-files-found: error
      - name: Redispatch active attestation-aware validity streams
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          projection_plan="${RUNNER_TEMP}/attestation-aware-projections.json"
          python -m math_flow list-active-projections \
            --problem "$MATH_FLOW_PROBLEM_ID" \
            --head refs/remotes/origin/main \
            --engine openrouter-repository-v1 \
            --output "$projection_plan"
          projection_dir="${RUNNER_TEMP}/projection-wake"
          if git ls-remote --exit-code origin refs/heads/projections >/dev/null 2>&1; then
            git fetch origin refs/heads/projections:refs/remotes/origin/projections
            git worktree add --detach "$projection_dir" refs/remotes/origin/projections
          else
            mkdir -p "$projection_dir"
          fi
          failed_stream_dispatches=0
          while IFS= read -r stream; do
            judgment_stream_id="$(jq -r '.judgmentStreamId' <<< "$stream")"
            primary_judge="$(jq -r '.primaryJudge' <<< "$stream")"
            first_projection="$(jq -r '.projections[0]' <<< "$stream")"
            remaining_projections="$(jq -c '.projections[1:]' <<< "$stream")"
            before_coverage="${RUNNER_TEMP}/attestation-coverage-before-${judgment_stream_id#sha256:}.json"
            coverage="${RUNNER_TEMP}/attestation-coverage-after-${judgment_stream_id#sha256:}.json"
            python -m math_flow judgment-plan \
              --problem "$MATH_FLOW_PROBLEM_ID" \
              --judge "$primary_judge" \
              --head refs/remotes/origin/main \
              --projection-dir "${RUNNER_TEMP}/projection-preflight" \
              --output "$before_coverage"
            python -m math_flow judgment-plan \
              --problem "$MATH_FLOW_PROBLEM_ID" \
              --judge "$primary_judge" \
              --head refs/remotes/origin/main \
              --projection-dir "$projection_dir" \
              --output "$coverage"
            while IFS= read -r subject_transaction; do
              dispatched=false
              for attempt in {1..5}; do
                if gh workflow run project-openrouter.yml \
                  --repo "$GITHUB_REPOSITORY" \
                  --ref main \
                  -f projection="$first_projection" \
                  -f problem="$MATH_FLOW_PROBLEM_ID" \
                  -f judgment_stream_id="$judgment_stream_id" \
                  -f subject_transaction="$subject_transaction" \
                  -f remaining_projections="$remaining_projections"; then
                  dispatched=true
                  break
                fi
                sleep 2
              done
              if [[ "$dispatched" != "true" ]]; then
                echo "Failed to redispatch $judgment_stream_id/$subject_transaction." >&2
                failed_stream_dispatches=$((failed_stream_dispatches + 1))
              fi
            done < <(
              jq -r --slurpfile before "$before_coverage" '
                .missingTransactions[]
                | .transactionId as $id
                | select(
                    ($before[0].missingTransactions
                    | map(.transactionId)
                    | index($id)) == null
                  )
                | $id
              ' "$coverage"
            )
          done < <(
            jq -c '
              .projections
              | map(select(
                  (.primaryJudge | endswith("validity-judgment-v3.json")) or
                  (.primaryJudge | endswith("validity-judgment-v4.json"))
                ))
              | sort_by(.judgmentStreamId, .projectionId)
              | group_by(.judgmentStreamId)[]
              | {
                  judgmentStreamId: .[0].judgmentStreamId,
                  primaryJudge: .[0].primaryJudge,
                  projections: [.[].projectionId]
                }
            ' "$projection_plan"
          )
          if [[ "$failed_stream_dispatches" -gt 0 ]]; then
            exit 1
          fi
